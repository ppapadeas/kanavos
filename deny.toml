# Licence and supply-chain policy. Run with `cargo deny check`.
# See docs/architecture.md §10 and docs/legal/legal-brief.md §8.

[graph]
all-features = true

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",
  "CC0-1.0",
]
confidence-threshold = 0.9

# Narrow exceptions, one crate each. BSL-1.0 (Boost) is OSI-approved and permissive: it asks only that the
# licence text accompany source distributions, which NOTICE and ASSETS.md cover.
# - clipboard-win and its error-code dependency: the Windows clipboard backend that eframe always enables
#   (through egui-winit's "clipboard" feature) for copy and paste in text fields.
[[licenses.exceptions]]
crate = "clipboard-win"
allow = ["BSL-1.0"]

[[licenses.exceptions]]
crate = "error-code"
allow = ["BSL-1.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Internal path dependencies of unpublished workspace crates are allowed.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
