[package]
name = "kanavos-raster"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Antialiased raster rendering of drawings to RGBA images and PNG (previews, thumbnails)."
publish = false

[lints]
workspace = true

[dependencies]
kanavos-drawing = { path = "../drawing" }
tiny-skia = { version = "0.12.0", default-features = false, features = ["std", "simd", "png-format"] }

[dev-dependencies]
png = "0.18"
