name: release

# Builds, signs and publishes a release when a version tag is pushed: `vX.Y.Z` (release) or `vX.Y.Z-pre.N`
# (pre-release, offered only to the "test builds" update channel). The tag must equal the workspace version.
# Installed copies of Kanavos find new releases here and update themselves (docs/updates.md).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          # The oldest supported runner, so the Linux binary runs on older glibc versions too.
          - os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.0"
      - uses: Swatinem/rust-cache@v2
      - name: Tag matches the workspace version
        shell: bash
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match workspace version $version"
            exit 1
          fi
      - name: Build and package
        run: cargo xtask dist
      - name: Sign
        shell: bash
        env:
          KANAVOS_UPDATE_SIGNING_KEY: ${{ secrets.KANAVOS_UPDATE_SIGNING_KEY }}
        run: |
          if [ -z "$KANAVOS_UPDATE_SIGNING_KEY" ]; then
            echo "::error::the KANAVOS_UPDATE_SIGNING_KEY secret is not set (see docs/releasing.md)"
            exit 1
          fi
          shopt -s nullglob
          archives=(dist/kanavos-*.zip dist/kanavos-*.tar.gz)
          cargo xtask sign "${archives[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.os }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sig
            dist/*.sha256
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Release notes from CHANGELOG.md
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[?" v "\\]?" { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "Kanavos $version" > notes.md; fi
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" out/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Kanavos ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md \
            --verify-tag $pre
